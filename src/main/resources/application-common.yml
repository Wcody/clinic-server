spring:
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  datasource:
    #数据库名称
    name: db_ams_server
    url: jdbc:mysql://localhost:3388/db_clinic?serverTimezone=Asia/Shanghai&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8 #url
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      add-mappings: true
  application:
    name: ams.server
  thymeleaf:
    check-template: false
    check-template-location: false
    cache: false
  mail:
    host: smtp.qq.com
    username: 123
    password: 123
    default-encoding: utf-8
  data:
    # Redis配置
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000
      password: 123@abc
  rabbitmq:
    host: 127.0.0.1
    port: 56721
    username: admin
    password: 123@abc
    virtual-host: /

#token
jwt:
  secret: secret.www.baqi.tech.secret
  expirationTime: 72000
  issuer: issuer.www.baqi.tech.issuer
  header: Authorization
  tokenHead: Bearer

##baqi配置
baqi:
  security:
    # 需要认证前缀，其它放行
    auth-prefix-arr: /ams/**,/bms/**
  redis:
    prefix:
      users: unknown


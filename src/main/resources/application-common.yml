#解决返回BODY中文乱码问题
server:
  port: 8800
  servlet:
    context-path: /
    encoding:
      charset: utf-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
# 日志配置
# 名称不能为logback.xml或者logback-spring.xml否则会被加载两次
logging:
  config: classpath:logback-common.xml
  file:
    path: ./.clinic/logs

# 配置Mybatis-Plus
mybatis-plus:
  global-config:
    db-config:
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
  configuration:
    # 输出SQL语句，生成环境关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启下划线转驼峰
    map-underscore-to-camel-case: false